<!DOCTYPE html><html><head><meta charset="utf-8"><title>Viewport harness</title>
<style>
 body{margin:0;background:#1b1b22;font:12px ui-monospace,Menlo,monospace;color:#9D98A8;padding:16px}
 form{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
 input,button{background:#0C0B10;border:1px solid #2B2836;color:#F2EFE9;font:inherit;
   padding:6px 9px;border-radius:4px}
 button{cursor:pointer;border-color:#F5A524;color:#F5A524}
 .stage{position:relative;transform-origin:0 0;border-radius:8px;overflow:hidden}
 iframe{border:0;background:#0C0B10;display:block}
 .fold{position:absolute;left:0;right:0;border-top:2px dashed #D0402A;pointer-events:none}
 .fold span{position:absolute;right:6px;top:4px;color:#D0402A;font-size:11px}
 #out{white-space:pre;line-height:1.7;margin-bottom:12px}
 .ok{color:#35C17E}.bad{color:#D0402A}
</style></head><body>
<form onsubmit="go(event)">
  <label>width <input id="w" value="1400" size="5"></label>
  <label>height <input id="h" value="1000" size="5"></label>
  <label>fold <input id="fold" value="714" size="5"></label>
  <label>page <input id="src" value="/online-casinos/" size="26"></label>
  <button>render</button>
</form>
<div id="out">—</div>
<div class="stage" id="stage"><iframe id="f"></iframe><div class="fold"><span>fold</span></div></div>
<script>
function q(k,d){ return new URLSearchParams(location.search).get(k) || d; }
function go(e){ if(e) e.preventDefault();
  var w=+document.getElementById('w').value, h=+document.getElementById('h').value,
      fold=+document.getElementById('fold').value, src=document.getElementById('src').value;
  var f=document.getElementById('f'), st=document.getElementById('stage');
  f.style.width=w+'px'; f.style.height=h+'px';
  var avail=document.body.clientWidth-32, scale=Math.min(1, avail/w);
  st.style.transform='scale('+scale+')';
  st.style.height=(h*scale)+'px'; st.style.width=(w)+'px';
  document.querySelector('.fold').style.top=fold+'px';
  document.querySelector('.fold span').textContent='fold @'+fold+'px';
  f.src=src;
}
document.getElementById('f').addEventListener('load', function(){
  var d=this.contentDocument, FOLD=+document.getElementById('fold').value;
  function top(sel){ var e=d.querySelector(sel); return e? Math.round(e.getBoundingClientRect().top+(d.documentElement.scrollTop||0)) : null; }
  var checks=[['H1','main h1, .hero h1'],['Author byline','.byline'],['Updated date','.byline-date'],
    ['Toplist H2','.sec:has(.lb) h2, #toplist h2'],['Toplist intro','.sec:has(.lb) .sec-head p'],
    ['Table starts','.lb'],['Row 1 logo','.lb-row .lb-logo']];
  document.getElementById('out').innerHTML = checks.map(function(c){
    var t=top(c[1]); if(t===null) return '  '+c[0].padEnd(15)+' not found';
    var ok=t<FOLD;
    return '  <span class="'+(ok?'ok':'bad')+'">'+(ok?'✓':'✗')+'</span> '+c[0].padEnd(15)+String(t).padStart(5)+'px';
  }).join('\n');
});
['w','h','fold','src'].forEach(function(k){ var v=q(k); if(v) document.getElementById(k).value=v; });
go();
</script></body></html>
