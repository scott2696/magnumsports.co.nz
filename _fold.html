<!DOCTYPE html><html><head><meta charset="utf-8"><title>Viewport harness</title>
<style>
 body{margin:0;background:#1b1b22;font:12px ui-monospace,Menlo,monospace;color:#9D98A8;padding:16px}
 form{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
 input,button{background:#0C0B10;border:1px solid #2B2836;color:#F2EFE9;font:inherit;padding:6px 9px;border-radius:4px}
 button{cursor:pointer;border-color:#F5A524;color:#F5A524}
 table{border-collapse:collapse;margin-bottom:14px;font-size:11.5px}
 th,td{padding:4px 9px;text-align:right;border-bottom:1px solid #2B2836;white-space:nowrap}
 th:first-child,td:first-child{text-align:left}
 th{color:#6B6678;font-weight:400;text-transform:uppercase;letter-spacing:.08em;font-size:10px}
 .ok{color:#35C17E}.bad{color:#D0402A}.na{color:#3A3648}
 .stage{position:relative;transform-origin:0 0;border-radius:8px;overflow:hidden}
 iframe{border:0;background:#0C0B10;display:block}
 .fold{position:absolute;left:0;right:0;border-top:2px dashed #D0402A;pointer-events:none}
 .fold span{position:absolute;right:6px;top:4px;color:#D0402A;font-size:11px}
 h2{font:600 13px ui-monospace;color:#F2EFE9;margin:0 0 8px}
</style></head><body>
<form onsubmit="run(event)">
  <label>width <input id="w" value="390" size="4"></label>
  <label>height <input id="h" value="900" size="4"></label>
  <label>fold <input id="fold" value="714" size="4"></label>
  <button>audit all</button>
  <label>preview <input id="src" value="/online-casinos/" size="24"></label>
  <button type="button" onclick="preview()">render</button>
</form>
<h2>Above-the-fold audit</h2>
<div id="out">—</div>
<div class="stage" id="stage"><iframe id="f"></iframe><div class="fold"><span>fold</span></div></div>
<script>
var PAGES = ['/online-casinos/','/online-betting/','/online-pokies/','/casino-bonus/',
  '/no-deposit-bonus/','/live-casino/','/crypto-casinos-nz/','/fast-payout-casinos/',
  '/casino-payout-percentages/','/new-casinos-nz/','/casino-reviews/',
  '/licensed-online-casinos/','/gambling-winnings-tax-nz/','/'];
var CHECKS = [['H1','main h1, .hero h1'],['Author','.byline'],['Updated','.byline-date'],
  ['Table H2','.sec:has(.lb) .sec-head h2'],['Table','.lb'],['Row 1 logo','.lb-row .lb-logo'],
  ['Lede hidden','.hero .lede']];

function measure(doc, sel, fold){
  var e = doc.querySelector(sel);
  if(!e) return null;
  var cs = e.ownerDocument.defaultView.getComputedStyle(e);
  if(cs.display === 'none') return 'hidden';
  return Math.round(e.getBoundingClientRect().top + (doc.documentElement.scrollTop||0));
}

function run(e){
  if(e) e.preventDefault();
  var w=+w_.value, h=+h_.value, fold=+fold_.value, i=0, rows=[];
  var f=document.createElement('iframe');
  f.style.cssText='width:'+w+'px;height:'+h+'px;position:absolute;left:-9999px;top:0;border:0';
  document.body.appendChild(f);
  function next(){
    if(i>=PAGES.length){ document.body.removeChild(f); render(rows, fold); return; }
    f.onload=function(){
      var d=f.contentDocument, r={page:PAGES[i], vals:[]};
      CHECKS.forEach(function(c){ r.vals.push(measure(d, c[1], fold)); });
      rows.push(r); i++; setTimeout(next, 40);
    };
    f.src = PAGES[i];
  }
  next();
}

function render(rows, fold){
  var html = '<table><tr><th>page</th>' +
    CHECKS.map(function(c){ return '<th>'+c[0]+'</th>'; }).join('') + '<th>result</th></tr>';
  rows.forEach(function(r){
    var bad = 0;
    var cells = r.vals.map(function(v, idx){
      var wantHidden = CHECKS[idx][0] === 'Lede hidden';
      if(v === null) return '<td class="na">n/a</td>';
      if(v === 'hidden') return wantHidden ? '<td class="ok">hidden</td>' : '<td class="na">hidden</td>';
      if(wantHidden){ bad++; return '<td class="bad">shown</td>'; }
      var ok = v < fold; if(!ok) bad++;
      return '<td class="'+(ok?'ok':'bad')+'">'+v+'</td>';
    }).join('');
    html += '<tr><td>'+r.page+'</td>'+cells+
      '<td class="'+(bad?'bad':'ok')+'">'+(bad? bad+' fail':'pass')+'</td></tr>';
  });
  document.getElementById('out').innerHTML = html + '</table>';
}

function preview(){
  var w=+w_.value, h=+h_.value, fold=+fold_.value;
  var f=document.getElementById('f'), st=document.getElementById('stage');
  f.style.width=w+'px'; f.style.height=h+'px'; f.src=src_.value;
  var scale=Math.min(1,(document.body.clientWidth-32)/w);
  st.style.transform='scale('+scale+')'; st.style.width=w+'px'; st.style.height=(h*scale)+'px';
  document.querySelector('.fold').style.top=fold+'px';
  document.querySelector('.fold span').textContent='fold @'+fold+'px';
}
var w_=document.getElementById('w'), h_=document.getElementById('h'),
    fold_=document.getElementById('fold'), src_=document.getElementById('src');
new URLSearchParams(location.search).forEach(function(v,k){
  var el=document.getElementById(k); if(el) el.value=v; });
run(); preview();
</script></body></html>
